<style>
/* ───────── 글꼴: Pretendard (공식 배포본의 부분 글꼴, 같은 주소에서 불러온다. 외부 요청 없음) ───────── */
@font-face{font-family:"Pretendard";font-weight:400;font-style:normal;font-display:swap;src:local("Pretendard Regular"),url("fonts/Pretendard-Regular.subset.woff2") format("woff2")}

@font-face{font-family:"Pretendard";font-weight:800;font-style:normal;font-display:swap;src:local("Pretendard ExtraBold"),url("fonts/Pretendard-ExtraBold.subset.woff2") format("woff2")}

/* ───────── 디자인 토큰 (원본: docs/design/anchor_design_tokens.txt 20번 구역, 라이트 테마 그대로) ───────── */
:root{

  --teal-600: #4E8EA2;

  --navy-700: #2F4156;
  --teal-700: #567C8D;
  --mist-200: #C8D9E6;
  --sand-100: #F5EFEB;
  --slate-500: #5E7892;
  --mist-400: #A7B7C6;
  --shell-100: #F3EFDF;
  --kelp-200: #BDCFAA;

  --domain-health-soft: #E4756722;

  --domain-rel-soft: #EDBC5922;
  --domain-rest-soft: #5BC0C322;
  --domain-money-soft: #A481C222;

  --pendant-resin-line: #2E7B7E;
  --pendant-point: #F3EEF6;
  --bottle-glass: #E6F4F3;
  --bottle-glass-line: #9CC6C4;
  --bottle-cork: #B27A45;

  --scroll-paper: #F1E0BF;

  --shadow-card: 0 1px 2px rgba(0,29,57,0.06), 0 6px 20px rgba(0,29,57,0.06);
  --shadow-gauge: inset 0 -8px 24px rgba(0,29,57,0.35);
  --shadow-glow: 0 0 10px rgba(123,189,232,0.55);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --radius-pixel: 2px;
  --radius-item: 14px;
  --radius-card: 20px;
  --radius-sheet: 28px;
  --radius-pill: 999px;
  --touch-min: 44px;
  --cycle-btn: 28px;
  --cycle-ring-miss: 2.5px;
  --cycle-ring-empty: 1.4px;
  --week-ring: 30px;
  --icon-domain: 24px;
  --pixel-year: 10px;
  --pixel-week: 8px;
  --pixel-sand-dot: 40%;
  --gauge-s: 56px;
  --gauge-l: 168px;
  --gauge-ring-w: 6px;
  --chart-stroke: 2px;
  --chart-point-r: 3px;
  --kelp-w: 4px;
  --opacity-wave-back: 0.75;
  --opacity-compare: 0.45;

  --font-sans: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;

/* 토큰 원본에는 다크(심해) 값도 있다. 기획안 v2.0에 테마 전환이 없어서 시연판은 라이트만 쓴다. */

/* ───────── 바탕 ───────── */
:root{box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--surface-sand);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:430px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative}
.pad{padding:0 var(--space-5)}
.grow{flex:1}
.row{display:flex;align-items:center;gap:var(--space-2)}
.sp{flex:1}
/* 글자 단계: display 28 · title 22 · heading 17 · item 15 · body 14 · caption 12 · micro 11 */
h1{font-size:22px;font-weight:800;line-height:30px;letter-spacing:-.01em;margin:0}
h2{font-size:17px;font-weight:700;line-height:24px;margin:0}
.sub{color:var(--ink-muted);font-size:14px;line-height:21px}
.tiny{font-size:12px;line-height:17px;font-weight:500;color:var(--ink-muted)}
.lab{font-size:14px;font-weight:700;margin:var(--space-5) 0 var(--space-2);display:block}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.125em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 영역별 색: --c 유리, --cs 진한 테두리, --ct 문항 카드 바탕, --rim 유리 가장자리 */
.d-health{--c:var(--domain-health);--cs:var(--domain-health-strong);--ct:var(--domain-health-soft);--rim:var(--glass-rim-health)}
.d-grow{--c:var(--domain-grow);--cs:var(--domain-grow-strong);--ct:var(--domain-grow-soft);--rim:var(--glass-rim-grow)}
.d-rel{--c:var(--domain-rel);--cs:var(--domain-rel-strong);--ct:var(--domain-rel-soft);--rim:var(--glass-rim-rel)}
.d-rest{--c:var(--domain-rest);--cs:var(--domain-rest-strong);--ct:var(--domain-rest-soft);--rim:var(--glass-rim-rest)}
.d-money{--c:var(--domain-money);--cs:var(--domain-money-strong);--ct:var(--domain-money-soft);--rim:var(--glass-rim-money)}

/* ───────── 씨글라스: 색 + 조각 모양 + 아이콘 (이름과 고정 순서를 늘 함께) ───────── */
.gl{display:inline-block;width:30px;height:30px;flex:none;line-height:0}
.gl svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 1px 1px rgba(0,29,57,.16))}
.gb{fill:var(--c);stroke:var(--rim);stroke-width:1.5;stroke-linejoin:round}
.gh{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:2.2;stroke-linecap:round}
.gi{fill:none;stroke:var(--on-domain);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.gl.out .gb{fill:var(--bg);stroke:var(--cs);stroke-width:2.5}
.gl.out .gh{display:none}
.gl.dim{opacity:var(--opacity-faint)}
.gl.gray .gb{fill:#E3E9EE;stroke:var(--mist-400)}
.gl.gray .gi{stroke:var(--ink-muted)}
.gl.clear .gb{fill:var(--glass-clear);stroke:var(--glass-clear-rim)}
.gl.sm{width:20px;height:20px}
.gl.md{width:var(--icon-domain);height:var(--icon-domain)}
.gl.xl{width:44px;height:44px}

/* ───────── 버튼 · 입력 ───────── */
.btn{display:flex;justify-content:center;align-items:center;gap:6px;width:100%;min-height:54px;border-radius:var(--radius-pill);background:var(--action);color:var(--on-action);font-weight:700;font-size:16px;padding:0 var(--space-5)}
.btn.ghost{background:var(--bg);color:var(--action);border:1.5px solid var(--line-control)}
.btn.whale{background:var(--whale)}
.btn[disabled]{background:#9FB3C8;color:#fff;cursor:default}
.btn.whale[disabled]{background:#E7D9CF;color:#8C7C75}
.btn.sm{width:auto;min-height:50px;font-size:15px;padding:0 var(--space-6)}
.link{color:var(--action);font-weight:700;min-height:var(--touch-min);padding:0 4px;font-size:14px}
.chip{display:inline-flex;align-items:center;min-height:var(--touch-min);border:1.5px solid var(--line);border-radius:var(--radius-pill);padding:0 var(--space-4);font-size:15px;background:var(--bg);font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.inp{width:100%;min-height:52px;border:1.5px solid var(--line-control);border-radius:var(--radius-item);padding:0 var(--space-4);background:var(--bg);font-size:16px;font-weight:600}
.inp::placeholder{color:var(--ink-muted);font-weight:400}
.card{border-radius:var(--radius-card);background:var(--surface);padding:14px var(--space-4)}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--radius-pill);background:var(--surface-sand);color:var(--ink-on-sand);font-size:11px;font-weight:700;white-space:nowrap}

/* ───────── ① 시작: 먼바다 → 얕은 물 → 물가 → 물거품 → 모래 (물 위에는 글자를 얹지 않는다) ───────── */
.app.sand{background:var(--surface-sand)}
.shore{height:clamp(120px,26vh,220px);flex:none;position:relative;overflow:hidden;background:linear-gradient(180deg,var(--shore-deep) 0%,var(--shore-water) 34%,var(--shore-shallow) 62%,var(--shore-foam) 92%)}
.shore svg{position:absolute;left:0;bottom:-1px;width:100%;height:34px;display:block}
.start{padding:var(--space-6) var(--space-5) var(--space-6);display:flex;flex-direction:column;flex:1}
.start h1{font-size:28px;line-height:36px;letter-spacing:-.02em}
.sand .sub,.sand .tiny{color:var(--ink-on-sand)}
.start .foot{margin-top:auto;padding-top:var(--space-6);display:flex;flex-direction:column;gap:10px}
.lock{margin:var(--space-4) 0 0;font-size:12px;font-weight:500;color:var(--ink-on-sand);display:flex;align-items:center;gap:6px}

/* ───────── ② 나다움 설계 ───────── */
.stephead{padding:var(--space-5) var(--space-5) 0;font-size:13px;font-weight:700;color:var(--ink-muted)}
.imp{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.imp .nm{flex:1;min-width:0}
.imp .nm b{display:block;font-size:17px;font-weight:700;line-height:24px}
.imp .cells{display:flex}
.imp .cells button{width:31px;height:var(--touch-min);display:grid;place-items:center}
.imp .cells .gl{width:24px;height:24px}
.imp .num{width:14px;text-align:right;font-size:15px;font-weight:800}
.alloc{margin:var(--space-4) 0 0}
.alloc h2{font-size:15px}
.allocbar{display:flex;gap:3px;margin:10px 0 8px;height:14px}
.allocbar i{display:block;background:var(--c);border:1px solid var(--rim)}
.allocbar i:first-child{border-radius:7px 0 0 7px}
.allocbar i:last-child{border-radius:0 7px 7px 0}
.stepper{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px}
.stepper button{width:var(--touch-min);height:var(--touch-min);border-radius:50%;background:var(--bg);border:1.5px solid var(--line-control);font-size:20px;font-weight:700;line-height:1}
.stepper button[disabled]{opacity:.35;cursor:default}
.prog{display:flex;gap:2px;padding:6px 14px 0}
.prog button{min-width:var(--touch-min);min-height:var(--touch-min);display:grid;place-items:center;border-radius:12px}
.prog button[aria-selected="true"]{background:var(--surface);box-shadow:inset 0 -3px 0 var(--ink)}
.prog button[disabled]{cursor:default}
.ask{display:flex;gap:10px;align-items:flex-start;margin:var(--space-3) 0}
.ask .who{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--sky-400);display:grid;place-items:center;flex:none;font-size:18px}
.ask p{margin:0;flex:1;background:var(--surface);border-radius:4px var(--radius-card) var(--radius-card) var(--radius-card);padding:12px 14px;font-size:16px;font-weight:700;line-height:23px}
.pick{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 12px;border-radius:var(--radius-item);text-align:left;font-size:15px;font-weight:600;line-height:22px;background:var(--bg);border:1.5px solid var(--line);margin-bottom:var(--space-2);cursor:pointer}
.pick[aria-checked="true"]{border-color:var(--cs);background:var(--ct)}
.pick .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--state-empty);flex:none;display:grid;place-items:center;background:var(--bg)}
.pick[aria-checked="true"] .box{background:var(--c);border-color:var(--c)}
.pick[aria-checked="true"] .box::after{content:"";width:11px;height:6px;border-left:2.2px solid var(--on-domain);border-bottom:2.2px solid var(--on-domain);transform:translateY(-1.5px) rotate(-45deg)}
.pick .q{flex:1;min-width:0}
.nah{display:block;font-size:12px;line-height:17px;font-weight:500;color:var(--ink-muted)}
.tgt{display:inline-block;padding:0 6px;border:1.5px dashed var(--line-control);border-radius:6px;font-weight:700;background:var(--bg);cursor:pointer;position:relative}
/* 점선 상자는 작게 보이지만 누르는 범위는 위아래로 44px */
.tgt::after{content:"";position:absolute;inset:-10px -4px}
.freq{font-size:11px;font-weight:600;color:var(--ink-muted);white-space:nowrap}
.hint{font-size:13px;color:var(--domain-health-strong);font-weight:600;min-height:20px;margin:2px 0 6px}
.sum{list-style:none;margin:var(--space-3) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--space-2)}
.sum li{display:flex;gap:10px;align-items:center;min-height:48px;padding:8px 12px;border-radius:var(--radius-item);background:var(--ct);font-size:15px;font-weight:600;line-height:22px}
.bottom{position:sticky;bottom:0;background:var(--bg);padding:12px var(--space-5) 14px;border-top:1px solid var(--line);margin-top:auto}
.bottom .two{display:flex;gap:10px}
.bottom .two .ghost{width:auto;flex:0 0 34%}

/* ───────── ③ 오늘 체크 ───────── */
.top{padding:var(--space-3) var(--space-5) 0}
.daterow{min-height:var(--touch-min);margin:0 -10px;gap:0}
.daterow b{font-size:clamp(17px,5.4vw,22px);font-weight:800;line-height:30px;letter-spacing:-.01em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.daterow .nav[data-a="day"]{width:40px}
.daterow .badge{margin-right:2px;flex:none}
.nav{width:var(--touch-min);height:var(--touch-min);border-radius:50%;font-size:22px;font-weight:700;color:var(--ink);line-height:1;display:grid;place-items:center;flex:none}
.nav[disabled]{opacity:.25;cursor:default}
.doms{display:flex;justify-content:space-between;padding:10px 4px 6px}
.doms>*{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;min-width:var(--touch-min);min-height:var(--touch-min)}
.top .doms{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:6px}
.notice{margin:var(--space-2) var(--space-5) 0;padding:10px 14px;border-radius:var(--radius-item);background:var(--surface-sand);color:var(--ink-on-sand);font-size:13px;font-weight:600}
.exp{margin:var(--space-3) var(--space-5) 0;background:var(--surface-deep);color:var(--ink-on-deep);border-radius:var(--radius-card);padding:12px 12px 12px var(--space-4);display:flex;align-items:center;gap:10px}
.exp small{display:block;color:var(--ink-on-deep-muted);font-size:12px;font-weight:500}
.exp b{font-size:17px;font-weight:700;line-height:24px}
.exp button{min-height:var(--touch-min);padding:0 var(--space-4);border-radius:var(--radius-pill);background:var(--sky-400);color:var(--ink);font-weight:700;font-size:14px;white-space:nowrap;flex:none}
.exp button[aria-pressed="true"]{background:#fff}
.list{padding:var(--space-2) var(--space-5) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
.grp{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;margin-top:var(--space-2)}
.it{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:7px 12px 7px 14px;border-radius:var(--radius-item);text-align:left;font-size:15px;font-weight:600;line-height:22px;background:var(--ct)}
.it .t{flex:1;min-width:0}
.it.na .t{color:var(--ink-muted)}
.it[disabled]{cursor:default}
.it .st{font-size:12px;font-weight:700;color:var(--cs);white-space:nowrap}
/* 순환 버튼 네 상태: 모양으로도 구분된다 (점선 원 · 채움+체크 · 진한 테두리 · 선) */
.cb{width:var(--cycle-btn);height:var(--cycle-btn);border-radius:50%;flex:none;display:grid;place-items:center}
.cb.e{border:var(--cycle-ring-empty) dashed var(--state-empty);background:var(--bg)}
.cb.done{background:var(--c)}
.cb.done::after{content:"";width:12px;height:7px;border-left:2.4px solid var(--on-domain);border-bottom:2.4px solid var(--on-domain);transform:translateY(-1.5px) rotate(-45deg)}
.cb.miss{border:var(--cycle-ring-miss) solid var(--cs);background:var(--bg)}
.cb.na::after{content:"";width:16px;height:2.5px;background:var(--state-na);border-radius:2px}
.fold{display:flex;align-items:center;gap:var(--space-2);width:100%;min-height:50px;padding:0 14px;border-radius:var(--radius-item);background:var(--bg);border:1.5px solid var(--line);font-size:14px;text-align:left;margin-top:var(--space-2)}
.fold b{font-size:15px;font-weight:700}
.fold .s{color:var(--ink-muted)}
.fold .chev{color:var(--ink-muted);font-size:16px}
.mks{display:flex;gap:5px;align-items:center}
.mk{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none}
.mk.done{background:var(--c)}
.mk.done::after{content:"";width:8px;height:4.5px;border-left:2px solid var(--on-domain);border-bottom:2px solid var(--on-domain);transform:translateY(-1px) rotate(-45deg)}
.mk.miss{border:2.5px solid var(--cs);background:var(--bg)}
.mk.na::after{content:"";width:10px;height:2px;background:var(--state-na);border-radius:2px}
.dock{position:sticky;bottom:0;margin-top:auto;background:var(--bg);border-top:1px solid var(--line)}
.dock .act{display:flex;align-items:center;gap:var(--space-3);padding:10px var(--space-5)}
.dock .left{font-size:14px;font-weight:800;white-space:nowrap}
.dock .act .sp{display:none}
.dock .act .btn{flex:1;width:auto;white-space:nowrap}
.tabbar{display:flex;border-top:1px solid var(--line)}
.tabbar button{flex:1;min-height:52px;font-size:13px;font-weight:600;color:var(--ink-muted)}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:800;box-shadow:inset 0 2.5px 0 var(--ink)}
.dusk .tabbar button[aria-current="page"]{color:var(--whale);box-shadow:inset 0 2.5px 0 var(--whale)}

/* ───────── ④ 하루 마무리 (노을: 글자는 노을 시트 위, 하늘 위 흰 글자에는 그림자) ───────── */
.dusk{background:var(--evening-bg)}
.dusk .dock{background:var(--evening-bg);border-color:#EFE3D9}
.dusk .tabbar{border-color:#EFE3D9}
.dusk .tiny,.dusk .sub{color:var(--evening-ink-muted)}
.dusk-top{position:relative;height:clamp(184px,29vh,262px);flex:none;overflow:hidden;color:#fff;
  background:linear-gradient(180deg,var(--dusk-900) 0%,var(--dusk-700) 30%,var(--dusk-500) 52%,var(--sunset-coral) 68%,var(--sunset-orange) calc(100% - 96px),var(--sunset-gold) calc(100% - 72px),var(--sunset-glow) calc(100% - 56px))}
.dusk-top svg.sky{position:absolute;inset:0;width:100%;height:100%;display:block}
.dusk-top .in{position:relative;padding:var(--space-2) var(--space-5) 0;text-shadow:0 1px 6px rgba(34,56,74,.6)}
.dusk-top .back{color:#fff;font-size:14px;font-weight:700;min-height:var(--touch-min);text-shadow:inherit}
.dusk-top h1{color:#fff;margin-top:2px}
.sheetbody{position:relative;background:var(--evening-bg);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;margin-top:calc(-1 * var(--radius-sheet));padding:var(--space-5) var(--space-5) 0;flex:1;display:flex;flex-direction:column}
.dusk .lab{color:var(--ink)}
.cond{display:flex;gap:6px}
.cond button{flex:1;min-height:104px;border:1.5px solid #F0E2D8;border-radius:var(--radius-item);background:var(--bg);text-align:center;padding:10px 0 8px;font-size:11px;line-height:14px;color:var(--evening-ink-muted);font-weight:600}
.cond button[aria-checked="true"]{border:2.5px solid var(--whale);padding:9px 0 7px}
.cond i{display:flex;align-items:flex-end;justify-content:center;gap:2.5px;height:30px;margin-bottom:6px}
.cond i b{width:5px;border-radius:2.5px;background:#F1E7E0}
.cond .c1 b.f{background:var(--cond-1)}.cond .c2 b.f{background:var(--cond-2)}.cond .c3 b.f{background:var(--cond-3)}.cond .c4 b.f{background:var(--cond-4)}.cond .c5 b.f{background:var(--cond-5)}
.cond strong{display:block;font-size:20px;font-weight:800;color:var(--ink);line-height:26px}
/* 병에 담는 한 줄: 두루마리 종이 칸 */
.scroll{position:relative;display:flex;align-items:center;gap:var(--space-2);margin:0 5px;padding:0 14px 0 12px;min-height:54px;background:linear-gradient(180deg,var(--scroll-paper-hi),var(--scroll-paper));box-shadow:0 2px 6px rgba(74,52,32,.12)}
.scroll::before,.scroll::after{content:"";position:absolute;top:-5px;bottom:-5px;width:11px;border-radius:6px;background:linear-gradient(90deg,var(--scroll-roll),var(--scroll-paper-hi) 45%,var(--scroll-roll))}
.scroll::before{left:-6px}.scroll::after{right:-6px}
.scroll svg{width:34px;height:22px;flex:none}
.scroll input{flex:1;min-width:0;border:none;background:transparent;font-size:16px;font-weight:600;color:var(--scroll-ink);min-height:50px;outline:none}
.scroll input::placeholder{color:var(--scroll-muted);font-weight:400}
.scroll:focus-within{box-shadow:0 0 0 2px var(--focus)}
.scroll span{font-size:11px;font-weight:600;color:var(--scroll-muted);white-space:nowrap}
.savehint{margin:0 0 var(--space-2);min-height:17px;text-align:center;font-size:12px;line-height:17px;font-weight:600;color:var(--evening-ink-muted)}
.dusk .card{background:var(--bg)}
.dusk .card.shell{background:var(--surface-shell)}
.card.shell h2{font-size:15px}

/* ───────── ④ 완료 화면: 노을 바다, 고래 꼬리, 떠 있는 병 ───────── */
.donescr{flex:1;display:flex;flex-direction:column;color:#fff;position:relative;overflow:hidden;min-height:560px;text-align:left;width:100%;cursor:pointer;background:var(--dusk-500)}
.donescr svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.donescr .txt{padding:var(--space-8) var(--space-6) 0;text-shadow:0 1px 6px rgba(34,56,74,.6);position:relative;z-index:1}
.donescr .txt .when{font-size:14px;font-weight:600}
.donescr h1{color:#fff;font-size:28px;line-height:36px;letter-spacing:-.02em;margin-top:var(--space-2)}
.donescr .pill{display:inline-flex;margin-top:var(--space-3);background:rgba(62,58,102,.6);border-radius:var(--radius-pill);padding:6px 14px;font-weight:700;font-size:13px;text-shadow:none}
.donescr .panel{margin:auto var(--space-5) var(--space-6);background:rgba(30,75,102,.86);border-radius:var(--radius-card);padding:var(--space-4) var(--space-3);text-align:center;position:relative;z-index:1}
.donescr .panel .gls{display:flex;justify-content:space-around}
.donescr .panel .gls>span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700}
.donescr .panel b{display:block;margin-top:var(--space-3);font-size:16px;font-weight:700}
.donescr .panel span.t{font-size:12px;font-weight:500;color:var(--evening-foam)}
@media (prefers-reduced-motion:no-preference){
  .donescr .bottle{animation:bob 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(4px) rotate(2deg)}}
}

/* ───────── ⑤ 주간 패턴 리포트 ───────── */
.wk{display:flex;align-items:center;justify-content:center;gap:4px;padding:var(--space-2) var(--space-3) 4px}
.wk b{font-size:17px;font-weight:700;min-width:176px;text-align:center}
.rep{padding:4px var(--space-5) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.rep>h2{margin-top:var(--space-2)}
.rcard{color:#fff;border-radius:var(--radius-card);padding:var(--space-4) 14px 18px;overflow:hidden;
  background:linear-gradient(180deg,var(--dusk-900) 0%,var(--dusk-700) 52%,var(--dusk-500) calc(100% - 8px),var(--sunset-orange) calc(100% - 8px),var(--sunset-orange) calc(100% - 5px),var(--evening-sea) calc(100% - 5px))}
.rcard small{color:var(--evening-foam);font-size:12px;font-weight:500}
.rcard .sumtxt{font-weight:700;font-size:17px;line-height:24px;margin:4px 0 2px;text-shadow:0 1px 6px rgba(34,56,74,.45)}
.rcard .cap{text-align:center;font-size:12px;font-weight:500;color:var(--evening-foam);margin:2px 0 0}
.pend{display:block;width:100%;height:auto}
.pend .vx{cursor:pointer}
.pend .vx:focus:not(:focus-visible){outline:none}
.pend text{font-family:var(--font-sans)}
.dusk h2{color:var(--ink)}
.gb2{display:grid;grid-template-columns:1fr;gap:var(--space-2)}
.gb2 .card b{display:block;font-size:12px;font-weight:600;color:var(--evening-ink-muted);margin-bottom:2px}
.gb2 .card p{margin:2px 0 0;font-size:14px;font-weight:600;line-height:21px}
.kelp{display:flex;align-items:flex-end;justify-content:space-between;height:128px;padding:0 2px;border-bottom:1px solid #EFE3D9}
.kelp button{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-size:11px;line-height:14px;color:var(--evening-ink-muted);min-width:var(--touch-min);height:100%;border-radius:12px;font-weight:600;padding-bottom:6px}
.kelp button[aria-pressed="true"]{background:#F3E7DC}
.kelp .n{font-weight:800;color:var(--ink);font-size:15px;line-height:20px}
.kelp svg{display:block;overflow:visible}
.kelp .dot{width:9px;height:9px;border-radius:50%;background:var(--depth-sand);margin-bottom:26px}
.daycard{font-size:14px}
.daycard .memo{font-weight:600;color:var(--scroll-ink);margin:4px 0 8px}
.strip{display:grid;grid-template-columns:44px repeat(7,1fr);gap:6px 2px;align-items:center;font-size:11px;font-weight:600;color:var(--evening-ink-muted)}
.strip .hd{text-align:center}
.strip .wl{white-space:nowrap}
.strip .wl.on{color:var(--ink);font-weight:800}
.strip .c{display:grid;place-items:center;height:26px}
.strip .c i{display:block;width:22px;height:22px;border-radius:50%;border:1.5px solid transparent}
.strip .c i.none{width:9px;height:9px;background:var(--depth-sand)}
.strip .c i.partial{height:11px;border-radius:22px 22px 0 0;border:none}
.strip .c i.zero,.legend i.zero{background:var(--depth-0);border-color:var(--depth-0-line)}
.strip .c i.today{box-shadow:0 0 0 2px var(--evening-bg),0 0 0 3.5px var(--whale)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;font-weight:600;color:var(--evening-ink-muted);margin-top:var(--space-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid transparent}
.legend i.none{width:5px;height:5px;background:var(--depth-sand)}
.legend i.partial{height:6px;border-radius:12px 12px 0 0;background:var(--depth-3);border:none}
.legend .scale{display:inline-flex;gap:2px}
.pat small{color:var(--evening-ink-muted);font-size:12px;font-weight:500}
.pat b{display:block;font-size:15px;font-weight:700;line-height:22px}
.radio{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 14px;border-radius:var(--radius-item);background:var(--bg);border:1.5px solid #F0E2D8;font-size:14px;font-weight:600;text-align:left}
.radio[aria-checked="true"]{border:2.5px solid var(--whale);padding:5px 13px}
.radio .o{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--evening-ink-muted);flex:none}
.radio[aria-checked="true"] .o{border:5.5px solid var(--whale)}
.radio[disabled]{cursor:default;opacity:.75}
.radio small{color:var(--evening-ink-muted);font-weight:600;white-space:nowrap}
.empty{text-align:center;padding:var(--space-2) 10px}
.empty b{display:block;font-size:15px}

/* ───────── 시트 ───────── */
.scrim{position:fixed;inset:0;background:rgba(0,29,57,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.scrim.center{align-items:center;padding:var(--space-5)}
.bs{width:100%;max-width:430px;background:var(--bg);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;padding:var(--space-6) var(--space-5) calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.bs h2{margin-bottom:4px}
.scard{display:flex;align-items:center;gap:var(--space-3);width:100%;min-height:64px;padding:10px 14px;border-radius:var(--radius-item);background:var(--surface);text-align:left;margin-top:10px}
.scard b{display:block;font-size:15px}
.scard .av{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;flex:none;border:1.5px solid var(--mist-200)}
.menu button{display:flex;align-items:center;width:100%;min-height:52px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line);text-align:left}
.menu button:last-child{border-bottom:none}
.bigstep{display:flex;align-items:center;justify-content:center;gap:var(--space-4);margin:18px 0 6px}
.bigstep output{font-size:24px;line-height:28px;font-weight:800;min-width:140px;text-align:center;font-variant-numeric:tabular-nums}
.bigstep button{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line-control);font-size:24px;font-weight:700;line-height:1}
.bigstep button[disabled]{opacity:.3;cursor:default}
/* 안전 카드: 흰 바탕과 잉크색만, 장식 없음 */
.safe{width:100%;max-width:390px;background:#fff;color:var(--ink);border-radius:var(--radius-card);padding:var(--space-6) 22px 18px;border:1.5px solid var(--ink)}
.safe h2{font-size:19px;line-height:27px;font-weight:800}
.safe p{margin:10px 0 14px;font-size:15px}
.safe ul{list-style:none;margin:0 0 var(--space-4);padding:0;border-top:1px solid var(--ink)}
.safe li{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-3);padding:12px 0;border-bottom:1px solid var(--ink);font-size:15px}
.safe li a{color:var(--ink);font-weight:800;white-space:nowrap}
.safe li span:last-child{font-weight:800;text-align:right}
.safe .btn{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.safe .btn.solid{background:var(--ink);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(132px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px var(--space-4);border-radius:var(--radius-pill);z-index:30;max-width:calc(100% - 40px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:480px){body{padding:0}.app{box-shadow:0 0 0 1px var(--line)}}

/* ───────── 날짜 (기기 시각, 주는 일–토) ───────── */
function pad(n){return (n<10?'0':'')+n}
function nowDate(){
  try{var p=new URLSearchParams(window.location.search).get('date');
    if(p&&/^\d{4}-\d{2}-\d{2}$/.test(p)){var a=p.split('-');return new Date(+a[0],+a[1]-1,+a[2],12)}}catch(e){}
  return new Date()}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function dow(s){return parse(s).getDay()}
function weekStart(s){return addDays(s,-dow(s))}
function TODAY(){return ymd(nowDate())}
function md(s){var d=parse(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일'}
function mdw(s){return md(s)+' '+DOWS[dow(s)]+'요일'}

/* ───────── 프로필 · 항목 ───────── */
function profile(){return LS.get('profile',null)}
function items(){return LS.get('items',[])}
function qText(tid,target){var t=TPL[tid];return t.q.replace(/\{.+?\}/,target||t.target||'')}

  return esc(t.q).replace(/\{.+?\}/,'<span class="tgt"'+(pressable?' role="button" tabindex="0" data-a="tgt" data-t="'+tid+'" aria-label="기준값 '+esc(target||t.target)+' 바꾸기"':'')+'>'+esc(target||t.target||'')+'</span>')}
function makeItems(list){
  return list.map(function(o,i){var t=TPL[o.template],target=o.target||t.target,q=qText(t.id,target);
    return {id:o.id||('i'+pad(i+1)),template:t.id,domain:t.domain,freq:t.freq,order:i,version:1,target:target,question:q,
      history:[{from:'0000-00-00',target:target,question:q}]}})}
function itemQ(it,date){var h=it.history||[],q=it.question;for(var i=0;i<h.length;i++)if(h[i].from<=date)q=h[i].question;return q}
function dailyItems(dom){return items().filter(function(i){return i.freq==='daily'&&(!dom||i.domain===dom)})}

/* ───────── 샘플 기록 (접속한 날 기준으로 날짜 계산) ───────── */
var baseCache=null;
function sample(){var p=profile();if(!p||p.mode!=='sample')return null;
  for(var i=0;i<D.samples.length;i++)if(D.samples[i].id===p.sample_id)return D.samples[i];return null}
function base(){
  var s=sample();if(!s)return null;var t=TODAY(),key=s.id+'|'+t;
  if(baseCache&&baseCache.key===key)return baseCache;
  var ws=weekStart(t),b={key:key,entries:{},logs:{},exps:[]};
  // 팀 원본 구조: 주 기준은 [w, 요일, …], 오늘 기준은 [d, …]. 앞쪽 칸이 날짜, 나머지가 값
  var wkMode=s.date_mode==='week',n=wkMode?2:1;
  function dateOf(r){return wkMode?addDays(ws,7*r[0]+r[1]):addDays(t,r[0])}
  s.daily_entries.forEach(function(r){var dt=dateOf(r);if(dt>=t||!VLABEL[r[n+1]])return;(b.entries[dt]=b.entries[dt]||{})[r[n]]=r[n+1]});
  s.weekly_entries.forEach(function(r){var wk=addDays(ws,7*r[0]);if(addDays(wk,7)>=t||!VLABEL[r[2]])return;(b.entries['W'+wk]=b.entries['W'+wk]||{})[r[1]]=r[2]});
  s.day_logs.forEach(function(r){var dt=dateOf(r);if(dt>=t)return;b.logs[dt]={condition:r[n],memo:r[n+1]||''}});
  s.experiments.forEach(function(o){var wk=addDays(ws,7*o.w);
    b.exps.push({week_start:wk,text:o.text,domain:o.domain,minutes:o.minutes,times:o.times!=null?o.times:o.target,
      done_dates:o.done_dows.map(function(x){return addDays(wk,x)}).filter(function(x){return x<t})})});
  baseCache=b;return b}

/* ───────── 기록 읽기·쓰기 (샘플 위에 내가 입력한 것만 덧씌움) ───────── */
function getE(key){var b=base(),o=LS.get('entries',{})[key],r={},k;
  if(b&&b.entries[key])for(k in b.entries[key])r[k]=b.entries[key][k];
  if(o)for(k in o){if(o[k]==null)delete r[k];else r[k]=o[k]}
  return r}
function setE(key,id,val){var all=LS.get('entries',{}),o=all[key]||{},b=base();
  var inBase=b&&b.entries[key]&&b.entries[key][id];
  if(val==null){if(inBase)o[id]=null;else delete o[id]}else o[id]=val;
  all[key]=o;LS.set('entries',all)}
function getLog(date){var o=LS.get('daylogs',{})[date];if(o)return o;var b=base();return (b&&b.logs[date])||null}
function setLog(date,log){var all=LS.get('daylogs',{});all[date]=log;LS.set('daylogs',all)}
function allDates(){var set={},b=base(),k;
  function add(k){var d=k.charAt(0)==='W'?k.slice(1):k;if(/^\d{4}-\d{2}-\d{2}$/.test(d))set[d]=1}
  if(b){for(k in b.entries)add(k);for(k in b.logs)add(k)}
  var o=LS.get('entries',{});for(k in o){var has=false;for(var j in o[k])if(o[k][j])has=true;if(has)add(k)}
  o=LS.get('daylogs',{});for(k in o)add(k);
  return Object.keys(set).sort()}
function exps(){var b=base(),ov=LS.get('experiments',[]);
  var list=(b?b.exps:[]).filter(function(e){return !ov.some(function(o){return o.week_start===e.week_start})});
  return list.concat(ov)}
function expOf(ws){var l=exps();for(var i=0;i<l.length;i++)if(l[i].week_start===ws)return l[i];return null}
function saveExp(e){var ov=LS.get('experiments',[]).filter(function(o){return o.week_start!==e.week_start});ov.push(e);LS.set('experiments',ov)}

/* ───────── 계산 규칙 (기획안 2장) ───────── */
// 항목 배분: 영역마다 2개 먼저, 남은 N−10개를 중요도 비율로. 내림 후 나머지가 큰 영역부터(같으면 중요도 높은 영역)
function allocate(imp,N){var sum=0,out={},rem=[],left=N-10,used=0;
  DOM.forEach(function(d){sum+=imp[d]});
  DOM.forEach(function(d,i){var x=left*imp[d]/sum,f=Math.floor(x+1e-9);out[d]=2+f;used+=f;rem.push({d:d,r:x-f,imp:imp[d],i:i})});
  rem.sort(function(a,b){return (b.r-a.r)>1e-9?1:(a.r-b.r)>1e-9?-1:(b.imp-a.imp)||(a.i-b.i)});
  for(var k=0;k<left-used;k++)out[rem[k%5].d]++;
  return out}
// 영역 채움: 그날 그 영역 ● ÷ (● + ○) ≥ 50%. ●·○가 없으면 판정 안 함
function domDay(date,dom){var e=getE(date),its=dailyItems(dom),a=0,b=0,n=0;
  its.forEach(function(i){var v=e[i.id];if(v==='done')a++;else if(v==='miss')b++;else if(v==='na')n++});
  return {done:a,miss:b,na:n,total:its.length,entered:a+b+n,state:(a+b)>0?(a/(a+b)>=0.5?'fill':'out'):(n>0?'gray':'dim')}}
function hasChecks(date){var e=getE(date);for(var k in e)if(e[k])return true;return false}
// 기록한 날 = 체크가 1개라도 있는 날. 컨디션까지 있으면 마무리한 날
function dayState(date){var l=getLog(date);if(l&&l.condition)return 'closed';return hasChecks(date)?'partial':'none'}
function filledN(date){return DOM.filter(function(d){return domDay(date,d).state==='fill'}).length}
// 실천률 = ● ÷ (● + ○). −와 미입력은 뺌. 주간 항목은 그 주 기록(W키)으로 합산
function weekStats(ws){var cnt={},rate={},conds=[],states=[],rec=0,cs=0,cn=0,its=items(),i;
  DOM.forEach(function(d){cnt[d]=[0,0]});
  function tally(e,freq){its.forEach(function(it){if(it.freq!==freq)return;var v=e[it.id];if(v==='done')cnt[it.domain][0]++;else if(v==='miss')cnt[it.domain][1]++})}
  for(i=0;i<7;i++){var dt=addDays(ws,i);tally(getE(dt),'daily');states.push(dayState(dt));if(hasChecks(dt))rec++;
    var l=getLog(dt),c=(l&&l.condition)||null;conds.push(c);if(c){cs+=c;cn++}}
  tally(getE('W'+ws),'weekly');
  DOM.forEach(function(d){var t=cnt[d][0]+cnt[d][1];rate[d]=t?Math.round(100*cnt[d][0]/t):null});
  return {rate:rate,conds:conds,states:states,recorded:rec,avg:cn?(cs/cn).toFixed(1):null}}
// 안전 규칙: 최근 3회 연속 컨디션 1(모두 최근 7일 안) 또는 최근 7일 마무리 3일 이상·평균 1.8 이하
function safetyHit(){var t=TODAY(),from=addDays(t,-6),ds=allDates().filter(function(d){return d<=t}).reverse(),closed=[];
  ds.forEach(function(d){var l=getLog(d);if(l&&l.condition)closed.push({d:d,c:l.condition})});
  var last=closed.slice(0,3);
  if(last.length===3&&last.every(function(x){return x.c===1&&x.d>=from}))return true;
  var w=closed.filter(function(x){return x.d>=from});
  if(w.length>=3){var s=0;w.forEach(function(x){s+=x.c});if(s/w.length<=1.8)return true}

    var s0=tm(ab[0]),e0=tm(ab[1]),st=parseInt(t.step,10)||30,o=[];if(e0<=s0)e0+=1440;
    for(var x=s0;x<=e0;x+=st)o.push(fmtClock(x%1440));return {opts:o}}

/* ───────── 시트 ───────── */
function renderSheet(){var s=S.sheet,h='',ae=document.activeElement,fk=ae&&sheets.contains(ae)&&ae.getAttribute('data-a')?ae.getAttribute('data-a')+'|'+(ae.getAttribute('data-v')||''):null;
  if(s){
    if(s.type==='samples'){h='<div class="scrim" data-a="closeSheet"><div class="bs" role="dialog" aria-modal="true" aria-label="샘플 고르기"><h2>샘플로 둘러보기</h2><p class="sub" style="margin:0">가상의 기록이에요. 오늘 날짜에 맞춰 채워져요.</p>'+
      D.samples.map(function(x){return '<button class="scard" data-a="pickSample" data-id="'+x.id+'"><span class="av" aria-hidden="true">'+esc(x.name.charAt(0))+'</span><span><b>'+esc(x.name)+'</b><span class="tiny">'+esc(x.job)+' · '+esc(x.desc||SDESC[x.id]||'')+'</span></span></button>'}).join('')+'</div></div>'}
    else if(s.type==='menu'){var p=profile();h='<div class="scrim" data-a="closeSheet"><div class="bs menu" role="dialog" aria-modal="true" aria-label="메뉴"><button data-a="csv">내 기록 내보내기 (CSV)</button>'+(p&&p.mode==='sample'?'<button data-a="leave">샘플 나가기</button>':'<button data-a="reset">처음부터 다시</button>')+'<button data-a="closeSheet" data-x="1">닫기</button></div></div>'}
    else if(s.type==='confirm'){h='<div class="scrim center"><div class="safe" role="alertdialog" aria-modal="true" aria-label="기록 삭제 확인"><h2>모든 기록을 지우고 처음부터 다시 할까요?</h2><p>이 기기에 저장된 항목과 기록이 모두 지워져요. 되돌릴 수 없어요.</p><div class="row"><button class="btn" data-a="closeSheet" data-x="1">취소</button><button class="btn solid" data-a="resetYes">지우기</button></div></div></div>'}
    else if(s.type==='target'){var t=TPL[s.tpl],o=targetOptions(t);
      h='<div class="scrim" data-a="closeSheet"><div class="bs" role="dialog" aria-modal="true" aria-label="기준값 수정"><h2>기준값 바꾸기</h2><p class="sub" style="margin:0">'+esc(qText(s.tpl,s.value))+'</p>'+
      (o.free?'<input class="inp" id="tfree" maxlength="12" value="'+esc(s.value)+'" style="margin:16px 0 6px" aria-label="기준값">':
        '<div class="bigstep"><button data-a="tStep" data-v="-1" aria-label="줄이기"'+(s.i<=0?' disabled':'')+'>−</button><output aria-live="polite">'+esc(o.opts[s.i])+'</output><button data-a="tStep" data-v="1" aria-label="늘리기"'+(s.i>=o.opts.length-1?' disabled':'')+'>+</button></div><p class="tiny" style="text-align:center;margin:0 0 6px">범위 '+esc(t.range)+'</p>')+
      (s.from==='today'?'<p class="tiny" style="text-align:center;margin:0 0 12px">다음 체크부터 이 기준으로 물어볼게요. 지난 기록의 문장은 그대로예요.</p>':'<div style="height:12px"></div>')+
      '<button class="btn" data-a="tSave">이 기준으로 정하기</button></div></div>'}
    else if(s.type==='safety'){var sf=D.safety;h='<div class="scrim center"><div class="safe" role="alertdialog" aria-modal="true" aria-labelledby="sfh"><h2 id="sfh">'+esc(sf.title)+'</h2><p>'+esc(sf.body)+'</p><ul>'+
      sf.contacts.map(function(c){var tel=c.tel||(/^[\d\- ]+$/.test(c.value)?c.value.replace(/\D/g,''):'');return '<li><span>'+esc(c.label||c.name)+'</span>'+(tel?'<a href="tel:'+tel+'">'+esc(c.value)+'</a>':'<span>'+esc(c.value)+'</span>')+'</li>'}).join('')+'</ul><button class="btn" data-a="closeSheet" data-x="1">'+esc(sf.close||'닫기')+'</button></div></div>'}
  }
  if(S.toast)h+='<div class="toast" role="status">'+esc(S.toast)+'</div>';
  sheets.innerHTML=h;
  if(s){var f=null;
    if(fk)Array.prototype.forEach.call(sheets.querySelectorAll('[data-a]'),function(x){if(!f&&!x.disabled&&x.getAttribute('data-a')+'|'+(x.getAttribute('data-v')||'')===fk)f=x});
    if(!f&&!sheets.contains(document.activeElement))f=sheets.querySelector('[role="dialog"] button:not([disabled]),[role="dialog"] input,[role="alertdialog"] .btn:last-child');
    if(f)try{f.focus({preventScroll:true})}catch(e){}}}

/* ───────── 그리기 ───────── */
function render(){var v=S.view,fk=document.activeElement&&document.activeElement.getAttribute&&document.activeElement.getAttribute('data-f');
  var dusk=v==='close'||v==='done'||v==='report';
  app.className='app'+(dusk?' dusk':'')+(v==='start'?' sand':'');
  app.innerHTML=v==='start'?vStart():v==='design'?vDesign():v==='today'?vToday():v==='close'?vClose():v==='done'?vDone():vReport();
  if(fk){var el=app.querySelector('[data-f="'+fk+'"]');if(el)try{el.focus({preventScroll:true})}catch(e){}}
  renderSheet()}

/* ───────── 동작 ───────── */
function enterToday(){S.date=TODAY();initFold();
  var t=S.date,ds=allDates().filter(function(d){return d<t&&dayState(d)!=='none'});
  S.back=ds.length>0&&ds[ds.length-1]<addDays(t,-3)&&dayState(t)==='none';
  go('today')}
function startSample(id){var s=null;D.samples.forEach(function(x){if(x.id===id)s=x});if(!s)return;
  LS.clear();LS.set('profile',{name:s.name,job:s.job,importance:s.importance,total:s.total,mode:'sample',sample_id:s.id});
  LS.set('items',makeItems(s.items));S.draft=null;enterToday();if(maybeSafety())renderSheet()}
function csv(){var rows=[['날짜','구분','영역','문항','값','컨디션','한 줄']],its=items(),val={done:'했음',miss:'못 했음',na:'해당 없음'};
  function q(x){x=String(x==null?'':x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}
  var keys={},b=base(),k;if(b)for(k in b.entries)keys[k]=1;var o=LS.get('entries',{});for(k in o)keys[k]=1;
  Object.keys(keys).sort(function(a,b){return a.replace('W','')<b.replace('W','')?-1:1}).forEach(function(key){var e=getE(key),wk=key.charAt(0)==='W',date=wk?key.slice(1):key,lg=wk?null:getLog(date);
    its.forEach(function(it){if(e[it.id])rows.push([date,wk?'주간(그 주 시작일)':'매일',NM[it.domain],itemQ(it,date),val[e[it.id]],lg&&lg.condition||'',lg&&lg.memo||''])})});
  var text='\ufeff'+rows.map(function(r){return r.map(q).join(',')}).join('\n');
  try{var blob=new Blob([text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='anchor_'+TODAY()+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);toast('기록 '+(rows.length-1)+'줄을 CSV로 내보냈어요')}
  catch(e){toast('이 환경에서는 파일을 저장할 수 없어요')}}
function openTarget(tpl,value,from,itemId){var t=TPL[tpl],o=targetOptions(t);if(!o)return false;
  var i=o.free?0:Math.max(0,o.opts.indexOf(value));S.sheet={type:'target',tpl:tpl,value:value,i:i,from:from,itemId:itemId};renderSheet();return true}

var ACT={
  job:function(el){S.draft.job=el.getAttribute('data-j');render()},
  startNext:function(){var n=document.getElementById('nm');S.draft.name=(n&&n.value||'').trim().slice(0,10);designInit();S.draft.maxIdx=0;go('design')},
  samples:function(){S.sheet={type:'samples'};renderSheet()},
  pickSample:function(el){startSample(el.getAttribute('data-id'))},
  closeSheet:function(el,ev){if(el.classList.contains('scrim')&&ev.target!==el)return;S.sheet=null;renderSheet()},
  imp:function(el){var d=S.draft;d.imp[el.getAttribute('data-k')]=+el.getAttribute('data-v');d.hint='';d.lists={};d.maxIdx=0;render()},
  total:function(el){var d=S.draft;d.total=Math.max(15,Math.min(20,d.total+ +el.getAttribute('data-v')));d.lists={};d.maxIdx=0;render()},
  dNext1:function(){var d=S.draft,eq=DOM.every(function(k){return d.imp[k]===d.imp.health});
    if(eq&&!d.warned){d.warned=true;d.hint='차이를 두면 더 나다운 구성이 돼요';render();return}
    d.hint='';d.step=2;d.idx=0;go('design')},
  dJump:function(el){var d=S.draft;d.idx=+el.getAttribute('data-i');d.hint='';go('design')},
  dChip:function(el){var d=S.draft,dom=designOrder()[d.idx],c=el.getAttribute('data-c');d.chips[dom]=d.chips[dom]===c?'':c;d.hint='';render()},
  dPick:function(el,ev){if(ev.target.closest&&ev.target.closest('[data-a="tgt"]'))return;
    var d=S.draft,dom=designOrder()[d.idx],L=designList(dom),id=el.getAttribute('data-t'),p=d.picks[dom],i=p.indexOf(id);
    if(i>=0){p.splice(i,1);d.hint=''}else if(p.length>=L.al){d.hint='다른 항목을 해제하거나 앞 단계에서 개수를 늘려요'}else{p.push(id);d.hint=''}
    render()},
  tgt:function(el){var d=S.draft,id=el.getAttribute('data-t');openTarget(id,d.targets[id]||TPL[id].target,'design')},
  dPrev:function(){var d=S.draft;d.hint='';if(d.step===1){go('start');return}if(d.idx>0)d.idx--;else d.step=1;go('design')},
  dConfirm:function(){var d=S.draft;d.hint='';if(d.idx<4){d.idx++;d.maxIdx=Math.max(d.maxIdx||0,d.idx);go('design')}else{d.step=3;go('design')}},
  dBack:function(){S.draft.step=2;S.draft.idx=0;S.draft.maxIdx=4;go('design')},
  dStart:function(){var d=S.draft;LS.clear();
    LS.set('profile',{name:d.name||'나',job:d.job,importance:d.imp,total:d.total,mode:'own',sample_id:null});
    LS.set('items',makeItems(designFinal()));S.draft=null;enterToday()},
  tab:function(el){var v=el.getAttribute('data-v');if(v==='report'){repInit();go('report')}else{if(S.view!=='today'&&S.view!=='close'){S.date=TODAY();initFold()}go('today')}},
  day:function(el){var n=+el.getAttribute('data-v'),d=addDays(S.date,n);if(d>TODAY())return;S.date=d;initFold();S.flash=null;render()},
  menu:function(){S.sheet={type:'menu'};renderSheet()},
  csv:function(){S.sheet=null;csv()},
  leave:function(){LS.clear();S.draft=null;go('start')},
  reset:function(){S.sheet={type:'confirm'};renderSheet()},
  resetYes:function(){LS.clear();S.draft=null;go('start')},
  cycle:function(el){
    var id=el.getAttribute('data-id'),gk=el.getAttribute('data-g'),g=null;groupsFor(S.date).forEach(function(x){if(x.key===gk)g=x});if(!g||!editable(S.date))return;
    var cur=getE(g.ekey)[id]||'',nx={'':'done',done:'miss',miss:'na',na:''}[cur];
    setE(g.ekey,id,nx||null);S.flash={id:id,key:g.ekey};S.back=false;
    var it=null;g.its.forEach(function(x){if(x.id===id)it=x});say(sayLabel(it,S.date)+', '+(VLABEL[nx]||'미입력'));
    clearTimeout(timers.flash);timers.flash=setTimeout(function(){S.flash=null;if(S.view==='today')render()},800);
    if(groupInfo(g).complete){if(S.fold[gk]===undefined){clearTimeout(timers['f'+gk]);timers['f'+gk]=setTimeout(function(){
      var g2=null;groupsFor(S.date).forEach(function(x){if(x.key===gk)g2=x});
      if(g2&&groupInfo(g2).complete&&S.fold[gk]===undefined&&S.view==='today'){S.fold[gk]=true;render()}},600)}}
    else{clearTimeout(timers['f'+gk]);delete S.fold[gk]}
    render()},
  unfold:function(el){S.fold[el.getAttribute('data-g')]=false;render()},
  expDone:function(){var t=TODAY(),ws=weekStart(t),e=expOf(ws);if(!e)return;e=JSON.parse(JSON.stringify(e));var i=e.done_dates.indexOf(t);
    if(i>=0)e.done_dates.splice(i,1);else e.done_dates.push(t);saveExp(e);render()},
  toClose:function(){var lg=getLog(S.date);S.close={date:S.date,cond:lg?lg.condition:null,memo:lg?lg.memo||'':''};go('close')},
  cond:function(el){S.close.cond=+el.getAttribute('data-v');var m=document.getElementById('memo');if(m)S.close.memo=m.value;render()},
  toDom:function(el){var k=el.getAttribute('data-k');S.fold[k]=false;go('today');var g=document.getElementById('grp-'+k);if(g&&g.scrollIntoView)try{g.scrollIntoView({block:'center'})}catch(e){}},
  saveClose:function(){var c=S.close,m=document.getElementById('memo');if(m)c.memo=m.value;if(!c.cond)return;
    setLog(c.date,{condition:c.cond,memo:c.memo.trim().slice(0,60)});
    if(maybeSafety()){S.view='today';S.date=TODAY();initFold();render();return}
    S.doneInfo={date:c.date,cond:c.cond,memo:c.memo.trim(),n:filledN(c.date)};go('done');
    clearTimeout(timers.done);timers.done=setTimeout(function(){if(S.view==='done')ACT.doneTap()},2000)},
  doneTap:function(){clearTimeout(timers.done);S.date=TODAY();initFold();go('today')},
  wk:function(el){var w=repWeeks(),i=w.indexOf(S.rep.ws)+ +el.getAttribute('data-v');if(i<0||i>=w.length)return;S.rep={ws:w[i],vx:null,day:null,pick:null};
    var ui=LS.get('ui',{});ui.last_report_week=w[i];LS.set('ui',ui);render()},
  vx:function(el){var k=el.getAttribute('data-k');S.rep.vx=S.rep.vx===k?null:k;render()},
  kday:function(el){var d=el.getAttribute('data-d');S.rep.day=S.rep.day===d?null:d;render()},
  expPick:function(el){S.rep.pick=+el.getAttribute('data-k');render()},
  expSave:function(){var rp=sampleReport(S.rep.ws),x=rp&&rp.experiments[S.rep.pick];if(!x)return;var ws=addDays(S.rep.ws,7);
    var b=base(),orig=null;if(b)b.exps.forEach(function(e){if(e.week_start===ws&&e.text===x.text)orig=e});
    if(orig)LS.set('experiments',LS.get('experiments',[]).filter(function(o){return o.week_start!==ws}));
    else saveExp({week_start:ws,text:x.text,domain:x.domain,minutes:x.minutes,times:x.times,done_dates:[]});S.rep.pick=null;render();toast('이번 주 실험으로 정했어요. 오늘 탭에서 볼 수 있어요')},
  tStep:function(el){var s=S.sheet,o=targetOptions(TPL[s.tpl]);s.i=Math.max(0,Math.min(o.opts.length-1,s.i+ +el.getAttribute('data-v')));s.value=o.opts[s.i];renderSheet()},
  tSave:function(){var s=S.sheet,f=document.getElementById('tfree'),val=f?(f.value.trim()||TPL[s.tpl].target):s.value;
    if(s.from==='design'){S.draft.targets[s.tpl]=val}
    else{var its=items(),t=TODAY();its.forEach(function(it){if(it.id!==s.itemId||it.target===val)return;
        it.version=(it.version||1)+1;it.target=val;it.question=qText(it.template,val);
        it.history=(it.history||[]).filter(function(h){return h.from!==t});it.history.push({from:t,target:val,question:it.question})});
      LS.set('items',its)}
    S.sheet=null;render()}
};

function onClick(ev){if(S.lp){S.lp=false;return}
  var el=ev.target.closest?ev.target.closest('[data-a]'):null;if(!el||el.disabled)return;
  var a=el.getAttribute('data-a');
  if(el.getAttribute('data-x')&&a==='closeSheet'){S.sheet=null;renderSheet();return}
  if(ACT[a])ACT[a](el,ev)}
function onKey(ev){var el=ev.target;
  if((ev.key==='Enter'||ev.key===' ')&&el.getAttribute&&el.getAttribute('data-a')&&el.tagName!=='BUTTON'&&el.tagName!=='INPUT'){ev.preventDefault();ev.stopPropagation();el.dispatchEvent(new MouseEvent('click',{bubbles:true}));return}
  if(ev.key==='Escape'&&S.sheet&&S.sheet.type!=='safety'&&S.sheet.type!=='confirm'){S.sheet=null;renderSheet();return}
  if((ev.key==='ArrowLeft'||ev.key==='ArrowRight')&&el.getAttribute&&el.getAttribute('data-a')==='imp'){ev.preventDefault();
    var d=S.draft,k=el.getAttribute('data-k'),v=Math.max(1,Math.min(5,d.imp[k]+(ev.key==='ArrowRight'?1:-1)));d.imp[k]=v;d.lists={};d.maxIdx=0;render();
    var n=app.querySelector('[data-f="imp-'+k+'-'+v+'"]');if(n)n.focus()}}
function onInput(ev){if(ev.target.id==='memo'&&S.close){S.close.memo=ev.target.value;var c=document.getElementById('memoCnt');if(c)c.textContent=ev.target.value.length+'/60'}
  if(ev.target.id==='nm'&&S.draft)S.draft.name=ev.target.value}
// 길게 누르면 기준값 수정
var lpT=null,lpXY=null;
function onDown(ev){S.lp=false;var el=ev.target.closest?ev.target.closest('[data-a="cycle"]'):null;if(!el||el.disabled)return;
  lpXY=[ev.clientX,ev.clientY];clearTimeout(lpT);
  lpT=setTimeout(function(){var id=el.getAttribute('data-id'),it=null;items().forEach(function(x){if(x.id===id)it=x});
    if(it&&openTarget(it.template,it.target,'today',it.id))S.lp=true},550)}
function onUp(){clearTimeout(lpT)}
function onMove(ev){if(lpXY&&(Math.abs(ev.clientX-lpXY[0])>10||Math.abs(ev.clientY-lpXY[1])>10))clearTimeout(lpT)}
// 왼쪽으로 밀면 어제로
var sw=null;
function onTS(ev){if(S.view!=='today'||S.sheet)return;var t=ev.touches[0];sw=[t.clientX,t.clientY]}
function onTE(ev){if(!sw||S.view!=='today')return;var t=ev.changedTouches[0],dx=t.clientX-sw[0],dy=t.clientY-sw[1];sw=null;
  if(Math.abs(dx)<70||Math.abs(dy)>40)return;var d=addDays(S.date,dx<0?-1:1);if(d>TODAY())return;S.date=d;initFold();S.flash=null;render()}

function boot(){app=document.getElementById('app');sheets=document.getElementById('sheets');live=document.getElementById('live');
  document.addEventListener('click',onClick);document.addEventListener('keydown',onKey);document.addEventListener('input',onInput);
  document.addEventListener('pointerdown',onDown);document.addEventListener('pointerup',onUp);document.addEventListener('pointercancel',onUp);document.addEventListener('pointermove',onMove);
  document.addEventListener('contextmenu',function(ev){if(ev.target.closest&&ev.target.closest('[data-a="cycle"]'))ev.preventDefault()});
  document.addEventListener('touchstart',onTS,{passive:true});document.addEventListener('touchend',onTE,{passive:true});
  var p=profile();
  if(p&&items().length){enterToday();if(maybeSafety())renderSheet()}else{S.view='start';render()}
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&window.top===window)navigator.serviceWorker.register('./sw.js').catch(function(){})}catch(e){}}
window.__anchor={S:S,LS:LS,allocate:allocate,weekStats:weekStats,targetOptions:targetOptions,TPL:TPL,safetyHit:safetyHit,dayState:dayState,filledN:filledN,addDays:addDays,weekStart:weekStart,TODAY:TODAY,recOrder:recOrder,expOf:expOf,items:items,getE:getE};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();

</script>
